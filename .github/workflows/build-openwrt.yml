# ============================================================
# Build OpenWrt 25.12.4 packages (natmap + luci-app-natmap) as ipk
#
# 说明：
#   - OpenWrt 25.12.4 官方 release 目录不再发布按目标的 SDK，
#     故采用「clone OpenWrt 源码树 + feeds」的方式编译，对所有 target 通用。
#   - feeds 使用 GitHub 镜像 + openwrt-25.12 分支（GitHub 镜像无 v25.12.4 tag）。
#   - 先串行构建 host 工具链（tools/compile + toolchain/compile），
#     避免 libdeflate-gzip 等 host 工具缺失导致 lua 解包失败。
#   - 包编译用 -j1 V=s，失败时打印日志尾部便于排查。
#
# 触发：仅 push 到 main（或打 v* tag），可手动 workflow_dispatch
# ============================================================
name: Build OpenWrt packages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: "${{ matrix.target }}/${{ matrix.subtarget }}"
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86
            subtarget: 64
            config_sym: CONFIG_TARGET_x86=y|CONFIG_TARGET_x86_64=y
          - target: x86
            subtarget: generic
            config_sym: CONFIG_TARGET_x86=y|CONFIG_TARGET_x86_generic=y
          - target: mediatek
            subtarget: filogic
            config_sym: CONFIG_TARGET_mediatek=y|CONFIG_TARGET_mediatek_filogic=y
          - target: bcm27xx
            subtarget: bcm2711
            config_sym: CONFIG_TARGET_bcm27xx=y|CONFIG_TARGET_bcm27xx_bcm2711=y
          - target: ramips
            subtarget: mt7621
            config_sym: CONFIG_TARGET_ramips=y|CONFIG_TARGET_ramips_mt7621=y
          - target: ipq807x
            subtarget: generic
            config_sym: CONFIG_TARGET_ipq807x=y|CONFIG_TARGET_ipq807x_generic=y

    env:
      OPENWRT_DIR: /tmp/openwrt

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libreadline-dev \
            libssl-dev python3 python3-setuptools rsync swig subversion unzip \
            zlib1g-dev file wget quilt coreutils xz-utils zip time

      - name: Cache OpenWrt build
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.OPENWRT_DIR }}/dl
            ${{ env.OPENWRT_DIR }}/staging_dir
            ${{ env.OPENWRT_DIR }}/build_dir
          key: openwrt-25.12.4-${{ matrix.target }}-${{ matrix.subtarget }}-${{ hashFiles('natmap/Makefile', 'luci-app-natmap/Makefile') }}
          restore-keys: |
            openwrt-25.12.4-${{ matrix.target }}-${{ matrix.subtarget }}-

      - name: Clone OpenWrt source (v25.12.4)
        run: |
          git clone --depth 1 --branch v25.12.4 \
            https://git.openwrt.org/openwrt/openwrt.git "$OPENWRT_DIR"

      - name: Init feeds (GitHub mirrors + retry)
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          cat > feeds.conf <<'EOF'
          src-git packages https://github.com/openwrt/packages.git^openwrt-25.12
          src-git luci https://github.com/openwrt/luci.git^openwrt-25.12
          src-git routing https://github.com/openwrt/routing.git^openwrt-25.12
          src-git telephony https://github.com/openwrt/telephony.git^openwrt-25.12
          EOF
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 30
          for i in 1 2 3; do
            echo "== feeds update attempt $i =="
            ./scripts/feeds update -a && break
            echo "feeds update failed, retrying in 10s..."
            sleep 10
          done
          ./scripts/feeds install -a

      - name: Override with forked packages
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          rm -rf feeds/luci/applications/luci-app-natmap
          cp -r "${{ github.workspace }}/luci-app-natmap" feeds/luci/applications/luci-app-natmap
          rm -rf feeds/packages/net/natmap
          cp -r "${{ github.workspace }}/natmap" feeds/packages/net/natmap

      - name: Select target
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          IFS='|' read -r -a SYMS <<< "${{ matrix.config_sym }}"
          : > .config
          for s in "${SYMS[@]}"; do echo "$s" >> .config; done
          make defconfig

      - name: Build host tools (serial)
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          make tools/compile -j1 V=s > /tmp/tools.log 2>&1 \
            || { echo '===== tail tools.log ====='; tail -100 /tmp/tools.log; exit 1; }
          make toolchain/compile -j1 V=s > /tmp/toolchain.log 2>&1 \
            || { echo '===== tail toolchain.log ====='; tail -100 /tmp/toolchain.log; exit 1; }
          ls -l staging_dir/host/bin/libdeflate-gzip

      - name: Build packages (serial, verbose)
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          make package/natmap/compile -j1 V=s > /tmp/build.log 2>&1 \
            || { echo '===== tail build.log ====='; tail -100 /tmp/build.log; exit 1; }
          make package/luci-app-natmap/compile -j1 V=s > /tmp/build2.log 2>&1 \
            || { echo '===== tail build2.log ====='; tail -100 /tmp/build2.log; exit 1; }
          make package/index

      - name: Collect packages
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          DEST="${{ github.workspace }}/out/${{ matrix.target }}-${{ matrix.subtarget }}"
          mkdir -p "$DEST"
          find bin -name '*.ipk' -o -name '*.apk' | sort | while read f; do cp "$f" "$DEST"/; done
          find bin -name 'Packages*' -o -name 'APKINDEX*' | sort | while read f; do cp "$f" "$DEST"/; done
          ls -l "$DEST"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ matrix.target }}-${{ matrix.subtarget }}
          path: out/${{ matrix.target }}-${{ matrix.subtarget }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd release
          printf '%s\n' \
            'OpenWrt 25.12.4 编译包（natmap + luci-app-natmap）' \
            '' \
            '支持的架构见文件后缀（target-subtarget）：' \
            '- x86-64 / x86-generic' \
            '- mediatek-filogic / bcm27xx-bcm2711 / ramips-mt7621 / ipq807x-generic' \
            '' \
            '安装：上传 ipk 到路由器后执行 opkg install *.ipk' \
            > NOTES.md
          gh release create "$GITHUB_REF_NAME" ./* \
            --title "openwrt-natmap $GITHUB_REF_NAME" \
            --notes-file NOTES.md
