# ============================================================
# Build OpenWrt 25.12 packages (natmap + luci-app-natmap) as ipk
# 使用官方 OpenWrt SDK 交叉编译，产出各架构 .ipk/.apk 包
# 触发：push 到 main / openwrt-25.12、打 v* tag、PR、手动 workflow_dispatch
# ============================================================
name: Build OpenWrt packages

on:
  push:
    branches: [main, openwrt-25.12]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: "${{ matrix.target }}/${{ matrix.subtarget }}"
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86
            subtarget: 64
          - target: x86
            subtarget: generic
          - target: mediatek
            subtarget: filogic
          - target: bcm27xx
            subtarget: bcm2711
          - target: ramips
            subtarget: mt7621
          - target: ipq807x
            subtarget: generic

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev file wget

      # 动态查找对应 target 的官方 SDK（SDK 文件名带编译器版本号，不能写死）
      - name: Locate OpenWrt SDK
        id: sdk
        run: |
          REL="25.12.4"
          TGT="${{ matrix.target }}"
          SUB="${{ matrix.subtarget }}"
          BASE="https://downloads.openwrt.org/releases/${REL}/targets/${TGT}/${SUB}"
          SDK=$(curl -fsSL "$BASE/" \
              | grep -oE 'openwrt-sdk-[^"]*Linux-x86_64\.tar\.xz' | head -n1)
          if [ -z "$SDK" ]; then
            echo "::error::SDK not found for ${TGT}/${SUB} at ${BASE}"
            exit 1
          fi
          echo "sdk_url=${BASE}/${SDK}" >> "$GITHUB_OUTPUT"
          echo "Found SDK: ${SDK}"

      - name: Download & extract SDK
        run: |
          mkdir -p "${{ runner.temp }}/sdk"
          wget -q -O "${{ runner.temp }}/sdk.tar.xz" "${{ steps.sdk.outputs.sdk_url }}"
          tar -C "${{ runner.temp }}/sdk" -xf "${{ runner.temp }}/sdk.tar.xz"
          echo "SDK_DIR=$(find "${{ runner.temp }}/sdk" -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n1)" >> "$GITHUB_ENV"

      - name: Init feeds (OpenWrt 25.12)
        working-directory: ${{ env.SDK_DIR }}
        run: |
          echo "src-git packages https://git.openwrt.org/feed/packages.git^openwrt-25.12" > feeds.conf
          echo "src-git luci https://git.openwrt.org/project/luci.git^openwrt-25.12" >> feeds.conf
          echo "src-git routing https://git.openwrt.org/feed/routing.git^openwrt-25.12" >> feeds.conf
          echo "src-git telephony https://git.openwrt.org/feed/telephony.git^openwrt-25.12" >> feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 用我们仓库的包覆盖官方同名包，确保构建的是本分支代码
      - name: Override with forked packages
        working-directory: ${{ env.SDK_DIR }}
        run: |
          rm -rf feeds/luci/applications/luci-app-natmap
          cp -r "${{ github.workspace }}/luci-app-natmap" feeds/luci/applications/luci-app-natmap
          rm -rf feeds/packages/net/natmap
          cp -r "${{ github.workspace }}/natmap" feeds/packages/net/natmap

      - name: Build packages
        working-directory: ${{ env.SDK_DIR }}
        run: |
          make defconfig
          make package/natmap/compile -j"$(nproc)"
          make package/luci-app-natmap/compile -j"$(nproc)"
          make package/index   # 生成 opkg 索引

      - name: Collect packages
        working-directory: ${{ env.SDK_DIR }}
        run: |
          DEST="${{ github.workspace }}/out/${{ matrix.target }}-${{ matrix.subtarget }}"
          mkdir -p "$DEST"
          # 收集所有 .ipk 与 .apk（含依赖），并带上 Packages 索引
          find bin -name '*.ipk' -o -name '*.apk' | sort | while read f; do cp "$f" "$DEST"/; done
          find bin -name 'Packages*' -o -name 'APKINDEX*' | sort | while read f; do cp "$f" "$DEST"/; done
          ls -l "$DEST"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ matrix.target }}-${{ matrix.subtarget }}
          path: out/${{ matrix.target }}-${{ matrix.subtarget }}
          if-no-files-found: error

  # 打 tag 时，把各架构的 ipk 汇总成一个 Release
  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd release
          NOTES=$(cat <<'EOF'
OpenWrt 25.12 编译包（natmap + luci-app-natmap）

支持的架构见文件后缀（target-subtarget）：
- x86-64 / x86-generic
- mediatek-filogic / bcm27xx-bcm2711 / ramips-mt7621 / ipq807x-generic

安装：上传 ipk 到路由器后执行 opkg install *.ipk
EOF
)
          gh release create "$GITHUB_REF_NAME" ./* \
            --title "openwrt-natmap $GITHUB_REF_NAME" \
            --notes "$NOTES"
